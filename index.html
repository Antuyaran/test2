<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wind Chime Project</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; 
            overflow: hidden; touch-action: none;
            display: flex; justify-content: center; align-items: center;
        }

        /* 页面容器：始终居中并填充背景 */
        .page-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        #page-intro { z-index: 10; background: #FFFFFF; } /* 首页白底 [cite: 138] */
        #page-main { z-index: 5; background: #55AEFF; visibility: hidden; } /* 风铃页蓝底 [cite: 6] */

        /* 核心：SVG 保持比例居中，不留白边（meet模式） */
        svg { width: 100%; height: 100%; display: block; }
        
        /* 首页样式隔离 */
        #page-intro .st_intro_bg{fill:#FFFFFF;}
        #page-intro .st_card{fill:#EFEFEF;stroke:#999999;stroke-width:2;stroke-miterlimit:10;}
        #page-intro .st_guide_text{font-family:'DominoMono-BoldC'; font-weight: bold; font-size:77px;}
        #page-intro .st_footer_text{font-family:'PingFangSC-Semibold'; font-size:20.57px;}

        /* 风铃页样式隔离 */
        #page-main .st_chime_bg{fill:#55AEFF;}
        #page-main .st_line{fill:none;stroke:#5B5B5B;stroke-width:4;stroke-miterlimit:10;}
        #page-main .st_footer_text{font-family:'PingFangSC-Semibold'; font-size:20.57px; fill:#FFFFFF;}

        .chime-piece { transform-origin: 50% 0%; cursor: pointer; }
        #fengling-video { display: none; }
    </style>
</head>
<body>

<video id="fengling-video" playsinline webkit-playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<div id="page-intro" class="page-container">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1150" preserveAspectRatio="xMidYMid meet">
        <rect width="750" height="1150" class="st_intro_bg"/>
        <g id="cards">
            <rect x="153.84" y="106.16" class="st_card" width="475.6" height="871.22"/>
            <rect x="129.44" y="119.72" class="st_card" width="475.6" height="871.22"/>
            <rect x="105.04" y="134.02" class="st_card" width="475.6" height="871.22"/>
            <text transform="matrix(1 0 0 1 159.0762 786.6869)" class="st_guide_text">
                <tspan x="0" y="0">Turn left </tspan>
                <tspan x="0" y="77.39">to the </tspan>
                <tspan x="0" y="154.77">next page</tspan>
            </text>
        </g>
        <g id="footer_intro">
            <text transform="matrix(0.9803 0 0 1 73.1968 1118.9316)" class="st_footer_text">Home page</text>
            <text transform="matrix(0.9803 0 0 1 443.4482 1118.9307)" class="st_footer_text">Project Name</text>
            <text transform="matrix(0.9803 0 0 1 636.168 1118.9307)" class="st_footer_text">00</text>
        </g>
        <g id="arrow">
            <rect x="616.92" y="560.43" transform="matrix(-1 0 0 -1 1313.5 1143.3)" width="79.71" height="22.44"/>
            <rect x="538.76" y="538.96" transform="matrix(-1 0 0 -1 1157.2 1100.3)" width="79.71" height="22.44"/>
            <rect x="479.8" y="559.71" transform="matrix(-0.707 -0.707 0.707 -0.707 483.4 1342.1)" width="79.71" height="22.44"/>
            <rect x="479.8" y="519.47" transform="matrix(-0.707 0.707 -0.707 -0.707 1262.3 538.5)" width="79.71" height="22.44"/>
        </g>
    </svg>
</div>

<div id="page-main" class="page-container">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1150" preserveAspectRatio="xMidYMid meet">
        <defs>
            <linearGradient id="FL_SVGID_1" gradientUnits="userSpaceOnUse" x1="409.33" y1="511.32" x2="447.83" y2="511.32" gradientTransform="matrix(0.994 0.109 0.109 -0.994 -51.8 1093.6)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#6B6B6B"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            </defs>
        
        <rect width="750" height="1150" class="st_chime_bg"/>

        <g id="Piece_5" class="chime-piece">
            <line class="st_line" x1="519" y1="-304" x2="365.6" y2="995.1"/>
            <polygon style="fill:url(#FL_SVGID_1);" points="386.7,1203.3 348.4,1199.2 473.5,61 511.8,65.2"/>
            <polygon style="fill:url(#FL_SVGID_1B_AI);" points="435.2,56.8 473.5,61 348.4,1199.2 310.1,1194.9"/>
        </g>
        <g id="footer_main">
            <text transform="matrix(0.9803 0 0 1 73.1968 1118.9316)" class="st_footer_text">Wind chime</text>
            <text transform="matrix(0.9803 0 0 1 443.4482 1118.9307)" class="st_footer_text">Project Name</text>
            <text transform="matrix(0.9803 0 0 1 636.168 1118.9307)" class="st_footer_text">01</text>
        </g>
    </svg>
</div>

<script>
    const video = document.getElementById('fengling-video');
    const pageIntro = document.getElementById('page-intro');
    const pageMain = document.getElementById('page-main');
    const mcIntro = new Hammer(pageIntro);
    const mcMain = new Hammer(pageMain);
    let isAudioUnlocked = false;
    let scene = 0;

    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => { video.pause(); isAudioUnlocked = true; });
        }
    }

    // 整页向左划开
    mcIntro.on("swipeleft", () => {
        unlockAudio();
        gsap.to(pageIntro, {
            x: -window.innerWidth,
            rotation: -5,
            duration: 0.8,
            ease: "power2.inOut",
            onComplete: () => {
                pageIntro.style.display = "none";
                pageMain.style.visibility = "visible";
                scene = 1;
            }
        });
    });

    // 风铃交互
    mcMain.on("panleft panright", (ev) => {
        if (scene !== 1) return;
        unlockAudio();
        if (Math.abs(ev.velocity) > 0.1) {
            const power = ev.velocityX * 10;
            gsap.to(".chime-piece", {
                rotation: power,
                duration: 0.8,
                stagger: { each: 0.05, from: power > 0 ? "start" : "end" },
                ease: "power1.out",
                onStart: () => { if (isAudioUnlocked) { video.currentTime = 0; video.play(); } },
                onComplete: () => {
                    gsap.to(".chime-piece", { rotation: 0, duration: 4, stagger: 0.03, ease: "elastic.out(1, 0.85)" });
                }
            });
        }
    });

    document.body.addEventListener('touchstart', unlockAudio, { once: true });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>矢量风铃-沉稳交互版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <style>
        /* 1. 消除顶部留白的关键 */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #fdfdfd; 
            overflow: hidden; 
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 改为顶部对齐 */
        }
        
        svg { 
            width: 100vw; 
            height: 100vh; 
            display: block;
        }

        .chime-piece { 
            transform-origin: 50% 0%; 
            cursor: pointer;
        }

        /* 隐藏视频元素，仅作音频源使用 */
        #fengling-video {
            display: none;
        }
    </style>
</head>
<body>

<!-- 插入 MP4 文件 -->
<video id="fengling-video" playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<!-- 
    preserveAspectRatio="xMidYMin slice" 确保内容从顶部开始缩放，
    不会因为屏幕比例问题在顶部留下白边 
-->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" preserveAspectRatio="xMidYMin slice">
    <style type="text/css">
        .st0{fill:none;stroke:#6B6B6B;stroke-width:5;stroke-miterlimit:10;}
        .st1{fill:#D8D8D8;}
        .st2{fill:#9B9B9B;}
        .st3{fill:#EFEFEF;}
    </style>
    
    <g id="Layer_4" class="chime-piece">
        <line class="st0" x1="239" y1="-18" x2="239" y2="1253"/>
        <rect x="161" y="332" class="st1" width="156" height="954"/>
    </g>
    <g id="Layer_5" class="chime-piece">
        <line class="st0" x1="488" y1="-45" x2="488" y2="1320"/>
        <rect x="410" y="399" class="st2" width="156" height="954"/>
    </g>
    <g id="Layer_3" class="chime-piece">
        <line class="st0" x1="263.48" y1="-207.19" x2="36.26" y2="1138.76"/>
        <rect x="32.17" y="223.96" transform="matrix(0.986 0.1665 -0.1665 0.986 118.2226 -8.5592)" class="st2" width="156" height="954"/>
    </g>
    <g id="Layer_2" class="chime-piece">
        <line class="st0" x1="500.19" y1="-48.41" x2="284.04" y2="1076"/>
        <rect x="289.86" y="162.99" transform="matrix(0.982 0.1888 -0.1888 0.982 127.4277 -57.9356)" class="st3" width="156" height="954"/>
    </g>
    <g id="Layer_1" class="chime-piece">
        <line class="st0" x1="769.5" y1="-84.5" x2="569.78" y2="993.02"/>
        <rect x="535.97" y="280.1" transform="matrix(0.9854 0.17 -0.17 0.9854 137.667 -93.3686)" class="st1" width="156" height="954"/>
    </g>
</svg>

<script>
    const video = document.getElementById('fengling-video');
    const mc = new Hammer(document.body);

    mc.on("panleft panright", (ev) => {
        if (Math.abs(ev.velocity) > 0.2) {
            // 降低 power 系数（从 30 降到 12），使撞击感更柔和、显得更重
            const power = ev.velocityX * 12; 

            gsap.to(".chime-piece", {
                rotation: power, 
                duration: 0.7, // 延长前摆时间
                stagger: {
                    each: 0.04,
                    from: power > 0 ? "start" : "end"
                },
                ease: "sine.out", // 使用更平滑的曲线
                onStart: () => {
                    // 每次互动重置并播放 MP4
                    video.currentTime = 0;
                    video.play().catch(e => console.log("等待用户首次点击交互后播放"));
                },
                onComplete: () => {
                    // 回弹效果：增加第二个参数 (0.8)，使其摆动幅度衰减更快，显得物体沉重
                    gsap.to(".chime-piece", {
                        rotation: 0,
                        duration: 3.5, // 拉长回弹总时长
                        stagger: 0.02,
                        ease: "elastic.out(1, 0.8)" 
                    });
                }
            });
        }
    });
</script>
</body>
</html>

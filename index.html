<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>矢量风铃交互</title>
    <!-- 引入必要的库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <style>
        body { margin: 0; background: #fdfdfd; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* 让 SVG 撑满屏幕 */
        svg { width: 100%; height: 90vh; }

        /* 关键：设置每个风铃块的旋转中心在顶部边缘 */
        .chime-piece { 
            transform-origin: 50% 0%; 
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        /* 增加触摸时的视觉反馈（可选） */
        .chime-piece:active { opacity: 0.8; }
    </style>
</head>
<body>

<!-- 这里粘贴的是你提供的 SVG 代码，我仅在每个 <g> 标签里加了 class="chime-piece" -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334">
    <style type="text/css">
        .st0{fill:none;stroke:#6B6B6B;stroke-width:5;stroke-miterlimit:10;}
        .st1{fill:#D8D8D8;}
        .st2{fill:#9B9B9B;}
        .st3{fill:#EFEFEF;}
    </style>
    
    <!-- 图层 4 -->
    <g id="Layer_4" class="chime-piece">
        <line class="st0" x1="239" y1="-18" x2="239" y2="1253"/>
        <rect x="161" y="332" class="st1" width="156" height="954"/>
    </g>
    <!-- 图层 5 -->
    <g id="Layer_5" class="chime-piece">
        <line class="st0" x1="488" y1="-45" x2="488" y2="1320"/>
        <rect x="410" y="399" class="st2" width="156" height="954"/>
    </g>
    <!-- 图层 3 -->
    <g id="Layer_3" class="chime-piece">
        <line class="st0" x1="263.48" y1="-207.19" x2="36.26" y2="1138.76"/>
        <rect x="32.17" y="223.96" transform="matrix(0.986 0.1665 -0.1665 0.986 118.2226 -8.5592)" class="st2" width="156" height="954"/>
    </g>
    <!-- 图层 2 -->
    <g id="Layer_2" class="chime-piece">
        <line class="st0" x1="500.19" y1="-48.41" x2="284.04" y2="1076"/>
        <rect x="289.86" y="162.99" transform="matrix(0.982 0.1888 -0.1888 0.982 127.4277 -57.9356)" class="st3" width="156" height="954"/>
    </g>
    <!-- 图层 1 -->
    <g id="Layer_1" class="chime-piece">
        <line class="st0" x1="769.5" y1="-84.5" x2="569.78" y2="993.02"/>
        <rect x="535.97" y="280.1" transform="matrix(0.9854 0.17 -0.17 0.9854 137.667 -93.3686)" class="st1" width="156" height="954"/>
    </g>
</svg>

<script>
    // 1. 设置声音
    const sound = new Howl({
        src: ['https://assets.mixkit.co/active_storage/sfx/1013/1013-preview.mp3'], // 这是一个清脆的打击声
        volume: 0.5
    });

    // 2. 初始化手势控制整个页面
    const mc = new Hammer(document.body);

    // 3. 监听滑动事件
    mc.on("panleft panright", (ev) => {
        // 当滑动速度足够快时触发
        if (Math.abs(ev.velocity) > 0.3) {
            const power = ev.velocityX * 30; // 计算摆动幅度（速度越快摆得越高）

            // 4. 让所有标记为 chime-piece 的元素动起来
            gsap.to(".chime-piece", {
                rotation: power, 
                duration: 0.5,
                stagger: {
                    each: 0.05,        // 每个方块之间延迟 0.05 秒，产生波动感
                    from: power > 0 ? "start" : "end" // 根据滑动方向决定从左往右动还是反过来
                },
                ease: "power2.out",
                onStart: () => {
                    // 播放声音，并根据速度调整音调
                    sound.rate(1 + Math.abs(ev.velocity) * 0.2);
                    sound.play();
                },
                onComplete: () => {
                    // 5. 动画结束后，带弹性的回到原位（物理效果的关键！）
                    gsap.to(".chime-piece", {
                        rotation: 0,
                        duration: 3,
                        stagger: 0.03,
                        ease: "elastic.out(1, 0.3)" // 模拟回弹颤动的效果
                    });
                }
            });
        }
    });
</script>
</body>
</html>

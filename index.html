<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wind Chime Project</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        /* 统一背景色 */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; 
            overflow: hidden; touch-action: none;
            display: flex; justify-content: center; align-items: center;
        }

        /* 页面容器：全屏层叠布局 */
        .page-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        #page-intro { z-index: 10; background: #FFFFFF; } /* 首页在上 */
        #page-main { z-index: 5; background: #55AEFF; visibility: hidden; } /* 风铃在下，初始隐藏 */

        /* 核心：保持 750x1150 比例不拉伸 */
        svg { width: 100%; height: 100%; display: block; }
        
        /* 样式隔离：首页样式 (homepage.svg) */
        #page-intro .st0{fill:#FFFFFF;}
        #page-intro .st1{fill:none;}
        #page-intro .st2{font-family:'PingFangSC-Semibold';}
        #page-intro .st3{font-size:21px;}
        #page-intro .st4{fill:#EFEFEF;stroke:#999999;stroke-width:2;stroke-miterlimit:10;}
        #page-intro .st5{font-family:'DominoMono-BoldC'; font-weight: bold;}
        #page-intro .st6{font-size:70px;}

        /* 样式隔离：风铃页样式 (fengling.svg) */
        #page-main .st0{fill:#55AEFF;}
        #page-main .st1{fill:none;}
        #page-main .st2{fill:#FFFFFF;}
        #page-main .st3{font-family:'PingFangSC-Semibold';}
        #page-main .st4{font-size:21px;}
        #page-main .st5{fill:none;stroke:#5B5B5B;stroke-width:4;stroke-miterlimit:10;}

        /* 风铃交互部分旋转中心设置在顶部边缘 */
        .chime-piece { 
            transform-origin: 50% 0%; 
            cursor: pointer;
        }
        #fengling-video { display: none; }
    </style>
</head>
<body>

<video id="fengling-video" playsinline webkit-playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<div id="page-intro" class="page-container">

        <rect width="750" height="1150" class="st0"/> <g id="intro_content">
            <rect x="153.84" y="106.16" class="st4" width="475.6" height="871.22"/>
            <rect x="129.44" y="119.72" class="st4" width="475.6" height="871.22"/>
            <rect x="105.04" y="134.02" class="st4" width="475.6" height="871.22"/>
            <text transform="matrix(1 0 0 1 146.0762 258.6869)">
                <tspan x="0" y="0" class="st5 st6">Turn left </tspan>
                <tspan x="0" y="80" class="st5 st6">to the </tspan>
                <tspan x="0" y="160" class="st5 st6">next page</tspan>
            </text>
        </g>
        <g id="intro_footer">
            <text transform="matrix(1 0 0 1 57.2224 1122.283)" class="st1 st2 st3" fill="#FFFFFF">Home Page</text>
            <text transform="matrix(1 0 0 1 442.7775 1122.2825)" class="st1 st2 st3" fill="#FFFFFF">Project Name</text>
            <text transform="matrix(1 0 0 1 643.4626 1122.282)" class="st1 st2 st3" fill="#FFFFFF">00</text>
        </g>
        <g id="intro_arrow">
            <rect x="616.92" y="560.43" width="79.71" height="22.44" transform="rotate(180 656.77 571.65)"/>
            <rect x="538.76" y="538.96" width="79.71" height="22.44" transform="rotate(180 578.61 550.18)"/>
            <rect x="479.8" y="559.71" width="79.71" height="22.44" transform="rotate(-135 519.65 570.93)"/>
            <rect x="479.8" y="519.47" width="79.71" height="22.44" transform="rotate(135 519.65 530.69)"/>
        </g>
    </svg>
</div>

                <stop offset="0" style="stop-color:#FFFFFF"/>
                <stop offset="1" style="stop-color:#ADADAD"/> <stop offset="1" style="stop-color:#000000"/> </linearGradient>

                <stop offset="0" style="stop-color:#FFFFFF"/>

            </linearGradient>
            <linearGradient id="SVGID_5_" gradientUnits="userSpaceOnUse" x1="623.95" y1="533.95" x2="662.45" y2="533.95" gradientTransform="matrix(1 0 0 -1 0 1067.9)">
                <stop offset="0" style="stop-color:#FFFFFF"/>
                <stop offset="1" style="stop-color:#ADADAD"/>

        <g id="main_content">
            <rect x="-19" y="-20" class="st0" width="781" height="1376"/>
            
            <text transform="matrix(1 0 0 1 70.4448 1122.283)" class="st2 st3 st4">Wind chime</text>

            <g id="Layer_4" class="chime-piece">

            <g id="Layer_1" class="chime-piece">
                <line class="st5 st6" x1="600" y1="-274" x2="595" y2="837.5"/>
                <rect x="560.5" y="54.5" style="fill:url(#SVGID_5_);" width="38.5" height="793"/>

        <g id="main_arrows">
            <rect x="616.9" y="560.4" width="79.7" height="22.4" transform="rotate(180 656.75 571.6)" class="st2"/>
            <rect x="538.8" y="539" width="79.7" height="22.4" transform="rotate(180 578.65 550.2)" class="st2"/>
            <rect x="479.8" y="559.7" width="79.7" height="22.4" transform="rotate(-135 519.65 570.9)" class="st2"/>

</div>

<script>
    const video = document.getElementById('fengling-video');
    const pageIntro = document.getElementById('page-intro');
    const pageMain = document.getElementById('page-main');
    
    // 初始化 Hammer.js，监听滑动
    const mcIntro = new Hammer(pageIntro);
    const mcMain = new Hammer(pageMain);
    let isAudioUnlocked = false;
    let scene = 0; // 0: 封面, 1: 风铃交互

    // 解锁音频
    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => {
                video.pause();
                isAudioUnlocked = true;
            }).catch(e => console.log("等待交互解锁音频"));
        }
    }

    // ================= 逻辑 0：封面页整页左滑 =================
    mcIntro.on("swipeleft", () => {
        unlockAudio();
        gsap.to(pageIntro, {
            x: -window.innerWidth, // 向左移出屏幕宽度
            rotation: -5, // 微小旋转增强卡片感
            duration: 0.8,
            ease: "power2.inOut",
            onComplete: () => {
                pageIntro.style.display = "none"; // 彻底隐藏封面
                pageMain.style.visibility = "visible"; // 显示主页
                scene = 1;
                // 风铃进场震动
                gsap.from(".chime-piece", {
                    rotation: 5,
                    stagger: 0.05,
                    duration: 2,
                    ease: "elastic.out(1, 0.5)"
                });
            }
        });
    });

    // ================= 逻辑 1：风铃页物理交互 =================
    mcMain.on("panleft panright", (ev) => {
        if (scene !== 1) return; // 只有在场景 1 才能互动
        unlockAudio();
        if (Math.abs(ev.velocity) > 0.1) {
            const power = ev.velocityX * 10;
            gsap.to(".chime-piece", {
                rotation: power,
                duration: 0.8,
                stagger: { each: 0.05, from: power > 0 ? "start" : "end" },
                ease: "power1.out",
                onStart: () => {
                    if (isAudioUnlocked) {
                        video.currentTime = 0;
                        video.play();
                    }
                },
                onComplete: () => {
                    // 回弹：沉重的金属阻尼感
                    gsap.to(".chime-piece", {
                        rotation: 0,
                        duration: 4,
                        stagger: 0.03,
                        ease: "elastic.out(1, 0.85)" 
                    });
                }
            });
        }
    });

    document.body.addEventListener('touchstart', unlockAudio, { once: true });
</script>
</body>
</html>

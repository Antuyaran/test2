<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wind Chime Project</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; 
            overflow: hidden; touch-action: none;
        }

        /* 页面容器：层叠布局 */
        .page-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        #page-intro { z-index: 10; background: #FFFFFF; } /* 首页背景为白色 [cite: 226] */
        #page-main { z-index: 5; background: #55AEFF; }  /* 风铃页背景为蓝色 [cite: 314] */

        /* 确保 SVG 不拉伸，保持比例 */
        svg { width: 100%; height: 100%; display: block; }
        
        /* 样式隔离：首页样式 [cite: 216-224] */
        #page-intro .st0{fill:#FFFFFF;}
        #page-intro .st1{fill:none;}
        #page-intro .st2{font-family:'PingFangSC-Semibold';}
        #page-intro .st3{font-size:21px;}
        #page-intro .st4{fill:#EFEFEF;stroke:#999999;stroke-width:2;stroke-miterlimit:10;}
        #page-intro .st5{font-family:'DominoMono-BoldC'; font-weight: bold;}
        #page-intro .st6{font-size:70px;}

        /* 样式隔离：风铃页样式 [cite: 295-312] */
        #page-main .fl_st0{fill:#55AEFF;}
        #page-main .fl_st1{fill:none;}
        #page-main .fl_st2{fill:#FFFFFF;}
        #page-main .fl_st3{font-family:'PingFangSC-Semibold';}
        #page-main .fl_st4{font-size:21px;}
        #page-main .fl_st5{fill:none;stroke:#5B5B5B;stroke-width:4;stroke-miterlimit:10;}

        .chime-piece { transform-origin: 50% 0%; cursor: pointer; }
        #fengling-video { display: none; }
    </style>
</head>
<body>

<video id="fengling-video" playsinline webkit-playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<div id="page-intro" class="page-layer">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1350" preserveAspectRatio="xMidYMid meet">
        <g id="intro_bg">
            <rect width="750" height="1350" class="st0"/> </g>
        <g id="intro_content">
            <rect x="153.84" y="106.16" class="st4" width="475.6" height="871.22"/>
            <rect x="129.44" y="119.72" class="st4" width="475.6" height="871.22"/>
            <rect x="105.04" y="134.02" class="st4" width="475.6" height="871.22"/>
            
            <text transform="matrix(1 0 0 1 146.0762 258.6869)">
                <tspan x="0" y="0" class="st5 st6">Turn left </tspan>
                <tspan x="0" y="90" class="st5 st6">to the </tspan>
                <tspan x="0" y="180" class="st5 st6">next page</tspan>
            </text>

            <rect x="616.92" y="560.43" width="79.71" height="22.44" transform="rotate(180 656.77 571.65)"/>
            <rect x="538.76" y="538.96" width="79.71" height="22.44" transform="rotate(180 578.61 550.18)"/>
            <rect x="479.8" y="559.71" width="79.71" height="22.44" transform="rotate(-135 519.65 570.93)"/>
            <rect x="479.8" y="519.47" width="79.71" height="22.44" transform="rotate(135 519.65 530.69)"/>
        </g>
        <g id="intro_footer">
            <text transform="matrix(1 0 0 1 57.2224 1222.283)" class="st2 st3">Home Page</text> <text transform="matrix(1 0 0 1 442.7775 1222.2825)" class="st2 st3">Project Name</text>
            <text transform="matrix(1 0 0 1 643.4626 1222.282)" class="st2 st3">00</text>
        </g>
    </svg>
</div>

<div id="page-main" class="page-layer">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1350" preserveAspectRatio="xMidYMid meet">
        <g id="fl_bg_layer">
            <rect width="750" height="1350" class="fl_st0"/> </g>
        
        <g id="Piece_5" class="chime-piece">
            <line class="fl_st5" x1="519" y1="-304" x2="365.6" y2="995.1"/>
            <linearGradient id="FL_SVGID_1" gradientUnits="userSpaceOnUse" x1="409.33" y1="511.32" x2="447.83" y2="511.32" gradientTransform="matrix(0.994 0.1093 0.1093 -0.994 -51.8 1093.6)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#FL_SVGID_1);" points="386.7,1203.3 348.4,1199.2 473.5,61 511.8,65.2"/>
        </g>
        <g id="Piece_4" class="chime-piece">
            <line class="fl_st5" x1="291" y1="-467" x2="263.1" y2="1032.4"/>
            <linearGradient id="FL_SVGID_4" gradientUnits="userSpaceOnUse" x1="279" y1="490" x2="317" y2="490" gradientTransform="matrix(1 0 0 -1 0 1152)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <rect x="241" y="90" width="38" height="1144" style="fill:url(#FL_SVGID_4);"/><rect x="279" y="90" width="38" height="1144" style="fill:url(#FL_SVGID_4);"/>
        </g>
        <g id="Piece_3" class="chime-piece">
            <line class="fl_st5" x1="254" y1="-353" x2="49" y2="726"/>
            <linearGradient id="FL_SVGID_3" gradientUnits="userSpaceOnUse" x1="75.84" y1="601.12" x2="114.34" y2="601.12" gradientTransform="matrix(0.982 0.187 0.187 -0.982 -102.3 1108.5)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#FL_SVGID_3);" points="33.1,1008.4 -4.7,1001.2 173.9,63 211.7,70.2"/>
        </g>
        <g id="Piece_2" class="chime-piece">
            <line class="fl_st5" x1="489" y1="-370" x2="227" y2="956.5"/>
            <linearGradient id="FL_SVGID_2" gradientUnits="userSpaceOnUse" x1="318.64" y1="642.53" x2="357.17" y2="642.53" gradientTransform="matrix(0.984 0.178 0.178 -0.984 -109 1080.7)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#FL_SVGID_2);" points="271.8,982 233.9,975.2 404.1,35.4 442,42.3"/>
        </g>
        <g id="Piece_1" class="chime-piece">
            <line class="fl_st5" x1="600" y1="-274" x2="595" y2="837.5"/>
            <linearGradient id="FL_SVGID_1B" gradientUnits="userSpaceOnUse" x1="598.95" y1="701.05" x2="637.45" y2="701.05" gradientTransform="matrix(1 0 0 -1 0 1152)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <rect x="560.5" y="54.5" width="38.5" height="793" style="fill:url(#FL_SVGID_1B);"/><rect x="599" y="54.5" width="38.5" height="793" style="fill:url(#FL_SVGID_1B);"/>
        </g>

        <g id="fl_footer">
            <text transform="matrix(1 0 0 1 73.2 1218.9)" class="fl_st2 fl_st3 fl_st4">Wind chime</text>
            <text transform="matrix(1 0 0 1 443.4 1218.9)" class="fl_st2 fl_st3 fl_st4">Project Name</text>
            <text transform="matrix(1 0 0 1 636.1 1218.9)" class="fl_st2 fl_st3 fl_st4">01</text>
            <rect x="616.9" y="560.4" width="79.7" height="22.4" transform="rotate(180 656.75 571.6)" class="fl_st2"/>
            <rect x="538.8" y="539" width="79.7" height="22.4" transform="rotate(180 578.65 550.2)" class="fl_st2"/>
            <rect x="479.8" y="559.7" width="79.7" height="22.4" transform="rotate(-135 519.65 570.9)" class="fl_st2"/>
            <rect x="479.8" y="519.5" width="79.7" height="22.4" transform="rotate(135 519.65 530.7)" class="fl_st2"/>
        </g>
    </svg>
</div>

<script>
    const video = document.getElementById('fengling-video');
    const pageIntro = document.getElementById('page-intro');
    const pageMain = document.getElementById('page-main');
    
    const mcIntro = new Hammer(pageIntro);
    const mcMain = new Hammer(pageMain);
    let isAudioUnlocked = false;
    let scene = 0;

    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => { video.pause(); isAudioUnlocked = true; });
        }
    }

    // ================= 场景 0：首页卡片式滑出 =================
    mcIntro.on("swipeleft", () => {
        unlockAudio();
        // 整个首页作为一个“卡片”划掉
        gsap.to(pageIntro, {
            x: -window.innerWidth,
            rotation: -5, 
            duration: 0.8,
            ease: "power2.inOut",
            onComplete: () => {
                pageIntro.style.display = "none";
                scene = 1;
                // 风铃页入场震动
                gsap.from(".chime-piece", {
                    rotation: 5, stagger: 0.05, duration: 2, ease: "elastic.out(1, 0.5)"
                });
            }
        });
    });

    // ================= 场景 1：风铃交互逻辑 =================
    mcMain.on("panleft panright", (ev) => {
        if (scene !== 1) return;
        unlockAudio();
        if (Math.abs(ev.velocity) > 0.1) {
            const power = ev.velocityX * 10;
            gsap.to(".chime-piece", {
                rotation: power,
                duration: 0.8,
                stagger: { each: 0.05, from: power > 0 ? "start" : "end" },
                ease: "power1.out",
                onStart: () => { if (isAudioUnlocked) { video.currentTime = 0; video.play(); } },
                onComplete: () => {
                    gsap.to(".chime-piece", { rotation: 0, duration: 4, stagger: 0.03, ease: "elastic.out(1, 0.85)" });
                }
            });
        }
    });

    document.body.addEventListener('touchstart', unlockAudio, { once: true });
</script>
</body>
</html>

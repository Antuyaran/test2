<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wind Chime Project</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; /* 统一背景色 */
            overflow: hidden; touch-action: none;
        }

        /* 页面容器管理 */
        .page-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
        }

        #page-intro { z-index: 10; } /* 封面在上 */
        #page-main { z-index: 5; visibility: hidden; } /* 风铃在下，初始隐藏 */

        svg { width: 100vw; height: 100vh; display: block; }
        
        /* 风铃片旋转中心设置 */
        .chime-piece { transform-origin: 50% 0%; cursor: pointer; }
        #fengling-video { display: none; }
    </style>
</head>
<body>

<video id="fengling-video" playsinline webkit-playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<div id="page-intro" class="page-container">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1150" preserveAspectRatio="xMidYMin slice">
        <style type="text/css">
            .st_intro_bg{fill:#55AEFF;} .st_c0{fill:none;} 
            .st_c1{font-family:'PingFangSC-Semibold'; fill:#FFFFFF;} .st_c2{font-size:21px;}
            .st_c3{fill:#EFEFEF;stroke:#999999;stroke-width:2;stroke-miterlimit:10;}
            .st_c4{font-family:'PingFangSC-Semibold'; font-weight: bold; fill:#000000;} .st_c5{font-size:70px;}
        </style>
        <rect width="750" height="1150" class="st_intro_bg"/>
        
        <g id="footer_0">
            <text transform="matrix(1 0 0 1 57.2224 1122.283)" class="st_c1 st_c2">Home Page</text>
            <text transform="matrix(1 0 0 1 442.7775 1122.2825)" class="st_c1 st_c2">Project Name</text>
            <text transform="matrix(1 0 0 1 643.4626 1122.282)" class="st_c1 st_c2">00</text>
        </g>

        <g id="bg_cards">
            <rect x="153.84" y="106.16" class="st_c3" width="475.6" height="871.22"/>
            <rect x="129.44" y="119.72" class="st_c3" width="475.6" height="871.22"/>
            <rect x="129.44" y="119.72" class="st_c3" width="475.6" height="871.22"/>
        </g>

        <g id="swipe_group">
            <rect x="105.04" y="134.02" class="st_c3" width="475.6" height="871.22"/>
            <text transform="matrix(1 0 0 1 146.0762 258.6869)">
                <tspan x="0" y="0" class="st_c4 st_c5">Turn left </tspan>
                <tspan x="0" y="90" class="st_c4 st_c5">to the </tspan>
                <tspan x="0" y="180" class="st_c4 st_c5">next page</tspan>
            </text>
            <g id="arrow">
                <rect x="616.92" y="560.43" width="79.71" height="22.44" transform="rotate(180 656.77 571.65)"/>
                <rect x="538.76" y="538.96" width="79.71" height="22.44" transform="rotate(180 578.61 550.18)"/>
                <rect x="479.8" y="559.71" width="79.71" height="22.44" transform="rotate(-135 519.65 570.93)"/>
                <rect x="479.8" y="519.47" width="79.71" height="22.44" transform="rotate(135 519.65 530.69)"/>
            </g>
        </g>
    </svg>
</div>

<div id="page-main" class="page-container">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" preserveAspectRatio="xMidYMin slice">
        <style type="text/css">
            .st_m0{fill:#55AEFF;} .st_m1{fill:none;} .st_m2{fill:#FFFFFF;}
            .st_m3{font-family:'PingFangSC-Semibold';} .st_m4{font-size:21px;}
            .st_m5{fill:none;stroke:#5B5B5B;stroke-width:4;stroke-miterlimit:10;}
        </style>
        
        <g id="main_bg">
            <rect x="-19" y="-20" class="st_m0" width="781" height="1376"/>
            <text transform="matrix(1 0 0 1 57.2224 1122.283)" class="st_m2 st_m3 st_m4">Wind chime</text>
            <text transform="matrix(1 0 0 1 442.7775 1122.2825)" class="st_m2 st_m3 st_m4">Project Name</text>
            <text transform="matrix(1 0 0 1 643.4626 1122.282)" class="st_m2 st_m3 st_m4">01</text>
        </g>

        <g id="图层_5" class="chime-piece">
            <line class="st_m5" x1="522.79" y1="-62.14" x2="389.64" y2="1075.1"/>
            <linearGradient id="SVGID_1_" gradientUnits="userSpaceOnUse" x1="433.2941" y1="720.9966" x2="471.7941" y2="720.9966" gradientTransform="matrix(0.994 0.1093 -0.1093 0.994 84.0329 -50.9513)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#SVGID_1_);" points="411.67,1286.35 373.4,1282.15 498.51,144 536.78,148.21"/>
        </g>

        <g id="图层_4" class="chime-piece">
            <line class="st_m5" x1="306.77" y1="-29.44" x2="288.06" y2="1115.4"/>
            <linearGradient id="GRAD_4" gradientUnits="userSpaceOnUse" x1="304" y1="745" x2="342" y2="745">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <rect x="266" y="173" width="76" height="1144" style="fill:url(#GRAD_4);"/>
        </g>

        <g id="图层_3" class="chime-piece">
            <line class="st_m5" x1="264.48" y1="-235.69" x2="74" y2="809"/>
            <linearGradient id="GRAD_3" gradientUnits="userSpaceOnUse" x1="98.91" y1="629.36" x2="137.41" y2="629.36" gradientTransform="matrix(0.982 0.187 -0.187 0.982 130.1 -21.6)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#GRAD_3);" points="58.14,1091.4 20.32,1084.2 198.9,146.05 236.72,153.24"/>
        </g>

        <g id="图层_2" class="chime-piece">
            <line class="st_m5" x1="468.19" y1="-84.91" x2="252.04" y2="1039.5"/>
            <linearGradient id="GRAD_2" gradientUnits="userSpaceOnUse" x1="341.85" y1="588.12" x2="380.35" y2="588.12" gradientTransform="matrix(0.984 0.178 -0.178 0.984 112.4 -51.3)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#GRAD_2);" points="296.8,1065.01 258.92,1058.15 429.13,118.44 467.02,125.3"/>
        </g>

        <g id="图层_1" class="chime-piece">
            <line class="st_m5" x1="623.24" y1="-56.31" x2="620" y2="920.5"/>
            <linearGradient id="GRAD_1" gradientUnits="userSpaceOnUse" x1="623.9" y1="533.9" x2="662.4" y2="533.9">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <rect x="585.45" y="137.45" width="77" height="793" style="fill:url(#GRAD_1);"/>
        </g>
    </svg>
</div>

<script>
    const video = document.getElementById('fengling-video');
    const pageIntro = document.getElementById('page-intro');
    const pageMain = document.getElementById('page-main');
    
    // 初始化手势控制
    const mcIntro = new Hammer(pageIntro);
    const mcMain = new Hammer(pageMain);
    let isAudioUnlocked = false;
    let currentScene = 0;

    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => { video.pause(); isAudioUnlocked = true; });
        }
    }

    // ================= 场景 0 逻辑：左滑飞出 =================
    mcIntro.on("swipeleft", (ev) => {
        unlockAudio();
        // 卡片组（包含文字和箭头）向左飞走
        gsap.to("#swipe_group", {
            x: -1000, 
            rotation: -15, 
            duration: 0.7, 
            ease: "power2.in",
            onComplete: () => {
                pageIntro.style.display = "none"; // 彻底隐藏封面
                pageMain.style.visibility = "visible"; // 显示主页
                currentScene = 1;
                
                // 进场时让风铃有个小晃动
                gsap.from(".chime-piece", {
                    rotation: 8,
                    stagger: 0.1,
                    duration: 2.5,
                    ease: "elastic.out(1, 0.5)"
                });
            }
        });
    });

    // ================= 场景 1 逻辑：风铃交互 =================
    mcMain.on("panleft panright", (ev) => {
        if (currentScene !== 1) return;
        unlockAudio();
        if (Math.abs(ev.velocity) > 0.1) {
            const power = ev.velocityX * 10; 
            gsap.to(".chime-piece", {
                rotation: power, 
                duration: 0.8,
                stagger: { each: 0.05, from: power > 0 ? "start" : "end" },
                ease: "power1.out",
                onStart: () => {
                    if (isAudioUnlocked) { video.currentTime = 0; video.play(); }
                },
                onComplete: () => {
                    gsap.to(".chime-piece", {
                        rotation: 0,
                        duration: 4,
                        stagger: 0.03,
                        ease: "elastic.out(1, 0.85)" 
                    });
                }
            });
        }
    });

    document.body.addEventListener('touchstart', unlockAudio, { once: true });
</script>
</body>
</html>

    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; 
            overflow: hidden; touch-action: none;
            display: flex; justify-content: center; align-items: center;
        }

        /* 页面容器：始终居中 */
        .page-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;

        #page-intro { z-index: 10; background: #FFFFFF; } /* 首页白底填充 */
        #page-main { z-index: 5; background: #55AEFF; visibility: hidden; } /* 风铃页蓝底填充 */

        /* 核心：SVG 保持比例居中缩放 */
        svg { width: 100%; height: 100%; display: block; }
        
        /* 首页样式隔离 */
        #page-intro .st_intro_bg{fill:#FFFFFF;}
        #page-intro .st_card{fill:#EFEFEF;stroke:#999999;stroke-width:2;stroke-miterlimit:10;}
        #page-intro .st_guide_text{font-family:'DominoMono-BoldC'; font-weight: bold; font-size:77.3874px;}
        #page-intro .st_footer_text{font-family:'PingFangSC-Semibold'; font-size:20.5707px;}

        /* 风铃页样式隔离 */
        #page-main .st_chime_bg{fill:#55AEFF;}
        #page-main .st_line{fill:none;stroke:#5B5B5B;stroke-width:4;stroke-miterlimit:10;}
        #page-main .st_footer_text{font-family:'PingFangSC-Semibold'; font-size:20.5707px; fill:#FFFFFF;}

        .chime-piece { transform-origin: 50% 0%; cursor: pointer; }
        #fengling-video { display: none; }
    </style>
</head>

<script>
    const video = document.getElementById('fengling-video');
    const pageIntro = document.getElementById('page-intro');
    const pageMain = document.getElementById('page-main');
    const mcIntro = new Hammer(pageIntro);
    const mcMain = new Hammer(pageMain);
    let isAudioUnlocked = false;
    let scene = 0;

    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => { video.pause(); isAudioUnlocked = true; }).catch(e => console.log("Unlock audio failed"));
        }
    }

    // 场景 0 转场
    mcIntro.on("swipeleft", () => {
        unlockAudio();
        gsap.to(pageIntro, {
            x: -window.innerWidth,
            rotation: -5,
            duration: 0.8,
            ease: "power2.inOut",
            onComplete: () => {
                pageIntro.style.display = "none";
                pageMain.style.visibility = "visible";
                scene = 1;
                gsap.from(".chime-piece", {
                    rotation: 5, stagger: 0.05, duration: 2, ease: "elastic.out(1, 0.5)"
                });
            }
        });
    });

    // 场景 1 交互
    mcMain.on("panleft panright", (ev) => {
        if (scene !== 1) return;
        unlockAudio();
        if (Math.abs(ev.velocity) > 0.1) {
            const power = ev.velocityX * 10;
            gsap.to(".chime-piece", {
                rotation: power,
                duration: 0.8,
                stagger: { each: 0.05, from: power > 0 ? "start" : "end" },
                ease: "power1.out",
                onStart: () => { if (isAudioUnlocked) { video.currentTime = 0; video.play(); } },
                onComplete: () => {
                    gsap.to(".chime-piece", { rotation: 0, duration: 4, stagger: 0.03, ease: "elastic.out(1, 0.85)" });
                }
            });
        }
    });

    document.body.addEventListener('touchstart', unlockAudio, { once: true });
</script>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金属质感风铃-最终版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; /* 匹配你图层6的背景色 */
            overflow: hidden; touch-action: none;
            display: flex; justify-content: center; align-items: flex-start;
        }
        svg { width: 100vw; height: 100vh; display: block; }
        
        /* 交互部分的旋转中心设置在顶部 */
        .chime-piece { 
            transform-origin: 50% 0%; 
            cursor: pointer;
        }
        #fengling-video { display: none; }
    </style>
</head>
<body>

<video id="fengling-video" playsinline webkit-playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<!-- 
    preserveAspectRatio="xMidYMin slice" 确保内容从顶部开始显示且不留白边
-->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" preserveAspectRatio="xMidYMin slice">
<style type="text/css">
	.st0{fill:#55AEFF;} .st1{fill:none;} .st2{fill:#FFFFFF;}
	.st3{font-family:'PingFangSC-Semibold';} .st4{font-size:21px;}
	.st5{fill:none;stroke:#5B5B5B;stroke-width:4;stroke-miterlimit:10;}
	.st6{fill:url(#SVGID_1_);}
    /* 注意：由于SVG ID在代码中通过 style 定义，我保留了你的完整 style 块 */
</style>

	<rect x="-19" y="-20" class="st0" width="781" height="1376"/>
	<g>
		<rect x="57.22" y="1104.22" class="st1" width="149.06" height="27.65"/>
		<text transform="matrix(1 0 0 1 57.2224 1122.283)" class="st2 st3 st4">Wind chime</text>
		<rect x="442.78" y="1104.22" class="st1" width="151.76" height="27.65"/>
		<text transform="matrix(1 0 0 1 442.7775 1122.2825)" class="st2 st3 st4">Project Name</text>
		<rect x="643.46" y="1104.22" class="st1" width="35.31" height="27.65"/>
		<text transform="matrix(1 0 0 1 643.4626 1122.282)" class="st2 st3 st4">01</text>
	</g>
</g>

	<line class="st5" x1="522.79" y1="-62.14" x2="389.64" y2="1075.1"/>
	<g>
		<linearGradient id="SVGID_1_" gradientUnits="userSpaceOnUse" x1="433.2941" y1="720.9966" x2="471.7941" y2="720.9966" gradientTransform="matrix(0.994 0.1093 -0.1093 0.994 84.0329 -50.9513)">
			<stop  offset="0" style="stop-color:#FFFFFF"/>
			<stop  offset="1" style="stop-color:#6B6B6B"/>
			<stop  offset="1" style="stop-color:#000000"/>
		</linearGradient>
		<polygon class="st6" points="411.67,1286.35 373.4,1282.15 498.51,144 536.78,148.21 "/>
		<linearGradient id="GRAD_5_B" gradientUnits="userSpaceOnUse" x1="5207.6328" y1="3888.5156" x2="5246.1328" y2="3888.5156" gradientTransform="matrix(-0.994 -0.1093 0.1093 -0.994 5187.5151 5147.3301)">

			<stop  offset="1" style="stop-color:#6B6B6B"/>

		<polygon style="fill:url(#GRAD_5_B);" points="460.24,139.79 498.51,144 373.4,1282.15 335.13,1277.94 "/>
	</g>
</g>

	<line class="st5" x1="623.24" y1="-56.31" x2="620" y2="920.5"/>
	<g>
		<linearGradient id="GRAD_1_A" gradientUnits="userSpaceOnUse" x1="623.9512" y1="533.9512" x2="662.4512" y2="533.9512">

	</g>
</g>
</svg>

<script>
    const video = document.getElementById('fengling-video');
    const mc = new Hammer(document.body);
    let isAudioUnlocked = false;

    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => {
                video.pause();
                isAudioUnlocked = true;
            }).catch(e => console.log("等待交互解锁音频"));
        }
    }

    mc.on("panleft panright", (ev) => {
        unlockAudio();
        if (Math.abs(ev.velocity) > 0.1) {
            const power = ev.velocityX * 10; 
            gsap.to(".chime-piece", {
                rotation: power, 
                duration: 0.8,
                stagger: { each: 0.05, from: power > 0 ? "start" : "end" },
                ease: "power1.out",
                onStart: () => {
                    if (isAudioUnlocked) {
                        video.currentTime = 0;
                        video.play();
                    }
                },
                onComplete: () => {
                    gsap.to(".chime-piece", {
                        rotation: 0,
                        duration: 5,
                        stagger: 0.03,
                        ease: "elastic.out(1, 0.6)" 
                    });
                }
            });
        }
    });
    document.body.addEventListener('touchstart', unlockAudio, { once: true });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>矢量风铃-交互增强版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; /* 对应你背景层的颜色 */
            overflow: hidden; touch-action: none;
            display: flex; justify-content: center; align-items: flex-start;
        }
        
        svg { width: 100vw; height: 100vh; display: block; }

        /* 只有风铃片会旋转，背景（图层6）不会有这个类名 */
        .chime-piece { 
            transform-origin: 50% 0%; 
            cursor: pointer;
        }

        #fengling-video { display: none; }
    </style>
</head>
<body>

<!-- 视频文件，添加了 playsinline 属性 -->
<video id="fengling-video" playsinline webkit-playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1334" preserveAspectRatio="xMidYMin slice">
    <style type="text/css">
        .st0{fill:#55AEFF;} .st1{fill:none;} .st2{fill:#FFFFFF;}
        .st3{font-family:'PingFangSC-Semibold';} .st4{font-size:20px;}
        .st5{fill:none;stroke:#6B6B6B;stroke-width:5;stroke-miterlimit:10;}
        .st6{fill:#ADADAD;} .st7{fill:#D8D8D8;} .st8{fill:#9B9B9B;}
    </style>

    <!-- 图层 6：背景层，不加 chime-piece 类名，保持静止 -->
    <g id="图层_6">
        <rect x="-19" y="-20" class="st0" width="781" height="1376"/>
        <g>
            <rect x="70.44" y="1274.89" class="st1" width="149.06" height="27.65"/>
            <text transform="matrix(1 0 0 1 70.4448 1292.0897)" class="st2 st3 st4">Wind chime</text>
            <rect x="342" y="1274.89" class="st1" width="151.76" height="27.65"/>
            <text transform="matrix(1 0 0 1 342 1292.0892)" class="st2 st3 st4">Project Name</text>
            <rect x="658.69" y="1274.89" class="st1" width="20.87" height="27.65"/>
            <text transform="matrix(1 0 0 1 658.6851 1292.0892)" class="st2 st3 st4">01</text>
        </g>
    </g>

    <!-- 图层 1-5：风铃层，添加 chime-piece 类名 -->
    <g id="图层_5" class="chime-piece">
        <line class="st5" x1="531.5" y1="-378" x2="533" y2="1135"/>
        <rect x="455" y="134" class="st6" width="156" height="1114"/>
    </g>
    <g id="图层_4" class="chime-piece">
        <line class="st5" x1="266.5" y1="-339" x2="275" y2="1121"/>
        <rect x="197" y="120" class="st7" width="156" height="1114"/>
    </g>
    <g id="图层_3" class="chime-piece">
        <line class="st5" x1="252.48" y1="-230.19" x2="25.26" y2="1115.76"/>
        <polygon class="st8" points="96.68,1234.96 -57.15,1205.03 101.66,120.96 255.49,150.89"/>
    </g>
    <g id="图层_2" class="chime-piece">
        <line class="st5" x1="535.5" y1="-269.5" x2="266.04" y2="986"/>
        <rect x="257.66" y="71.65" transform="matrix(0.982 0.1888 -0.1888 0.982 123.7997 -52.1455)" class="st2" width="156" height="1104.41"/>
    </g>
    <g id="图层_1" class="chime-piece">
        <line class="st5" x1="764.5" y1="-176.5" x2="558.78" y2="970.02"/>
        <polygon class="st7" points="598.73,1291.1 445.01,1260.53 607.21,177.1 760.94,207.66"/>
    </g>
</svg>

<script>
    const video = document.getElementById('fengling-video');
    const mc = new Hammer(document.body);
    let isAudioUnlocked = false;

    // 关键：解锁音频权限的函数
    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => {
                video.pause(); // 播放瞬间立即暂停，完成权限解锁
                isAudioUnlocked = true;
                console.log("音频权限已解锁");
            }).catch(err => console.log("解锁失败:", err));
        }
    }

    mc.on("panleft panright", (ev) => {
        // 用户一旦开始滑动，立刻尝试解锁音频
        unlockAudio();

        if (Math.abs(ev.velocity) > 0.15) {
            const power = ev.velocityX * 10; // 进一步降低系数，增加重量感

            gsap.to(".chime-piece", {
                rotation: power, 
                duration: 0.8,
                stagger: {
                    each: 0.06,
                    from: power > 0 ? "start" : "end"
                },
                ease: "power1.out",
                onStart: () => {
                    if (isAudioUnlocked) {
                        video.currentTime = 0;
                        video.play();
                    }
                },
                onComplete: () => {
                    gsap.to(".chime-piece", {
                        rotation: 0,
                        duration: 4,
                        stagger: 0.03,
                        ease: "elastic.out(1, 0.85)" // 增加阻尼系数，让摆动更快停下，显得更重
                    });
                }
            });
        }
    });

    // 额外保险：点击屏幕任何地方也解锁音频
    document.body.addEventListener('click', unlockAudio, { once: true });
</script>
</body>
</html>

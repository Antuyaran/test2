<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Wind Chime</title>
    <style>
        @font-face {
            font-family: 'DominoMono-BoldC';
            src: url('DominoMono-BoldC.otf');
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #333;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            touch-action: none;
        }

        svg {
            height: 100%;
            width: auto;
            max-width: 100%;
            display: block;
        }

        #homepage { z-index: 10; background: white; }
        #fengling { z-index: 5; }

        .domino-font { font-family: 'DominoMono-BoldC', sans-serif !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="homepage" class="page">
            <svg viewBox="0 0 750 1150" preserveAspectRatio="xMidYMid meet">
                <rect y="0.46" fill="#FFFFFF" width="750" height="1150"/>
                <g id="cards">
                    <rect x="161.6" y="98.56" fill="#EFEFEF" stroke="#999999" stroke-width="2" width="475.6" height="871.22"/>
                    <rect x="137.2" y="112.12" fill="#EFEFEF" stroke="#999999" stroke-width="2" width="475.6" height="871.22"/>
                    <rect x="112.8" y="126.42" fill="#EFEFEF" stroke="#999999" stroke-width="2" width="475.6" height="871.22"/>
                </g>
                <text transform="matrix(1 0 0 1 166.8373 779.088)" class="domino-font" style="font-size:77.38px;">
                    <tspan x="0" y="0">Turn left </tspan>
                    <tspan x="0" y="77.39">to the </tspan>
                    <tspan x="0" y="154.77">next page</tspan>
                </text>
                <text transform="matrix(0.9803 0 0 1 90.1237 306.4592)" font-family="sans-serif" font-size="20.57">Home page</text>
                <text transform="matrix(0.9803 0 0 1 460.3751 306.4592)" font-family="sans-serif" font-size="20.57">Project Name</text>
                <text transform="matrix(0.9803 0 0 1 653.0948 306.4592)" font-family="sans-serif" font-size="20.57">00</text>
            </svg>
        </div>

        <div id="fengling" class="page">
            <svg viewBox="0 0 750 1150" preserveAspectRatio="xMidYMid meet">
                <rect fill="#55AEFF" width="750" height="1150"/>
                
                <g id="layer_5" class="chime-tube">
                    <polygon fill="url(#grad1)" points="386.7,1203.3 348.4,1199.2 473.5,61 511.8,65.2"/>
                    <linearGradient id="grad1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#000000"/></linearGradient>
                </g>
                
                <g id="layer_4" class="chime-tube">
                    <rect x="279" y="90" fill="url(#grad2)" width="38" height="1144"/>
                    <linearGradient id="grad2"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#000000"/></linearGradient>
                </g>

                <g id="layer_3" class="chime-tube">
                    <polygon fill="url(#grad3)" points="33.1,1008.4 -4.7,1001.2 173.9,63 211.7,70.2"/>
                    <linearGradient id="grad3"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#000000"/></linearGradient>
                </g>

                <g id="layer_2" class="chime-tube">
                    <polygon fill="url(#grad4)" points="271.8,982 233.9,975.2 404.1,35.4 442,42.3"/>
                    <linearGradient id="grad4"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#000000"/></linearGradient>
                </g>

                <g id="layer_1" class="chime-tube">
                    <rect x="599" y="54.5" fill="url(#grad5)" width="38.5" height="793"/>
                    <linearGradient id="grad5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#000000"/></linearGradient>
                </g>

                <text transform="matrix(0.9803 0 0 1 73.1968 1118.9316)" fill="#FFFFFF" font-family="sans-serif" font-size="20.57">Wind chime</text>
                <text transform="matrix(0.9803 0 0 1 443.4482 1118.9307)" fill="#FFFFFF" font-family="sans-serif" font-size="20.57">Project Name</text>
                <text transform="matrix(0.9803 0 0 1 636.168 1118.9307)" fill="#FFFFFF" font-family="sans-serif" font-size="20.57">01</text>
            </svg>
        </div>
    </div>

    <audio id="chimeAudio" src="fengling.mp4"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const homepage = document.getElementById('homepage');
        const audio = document.getElementById('chimeAudio');
        const tubes = document.querySelectorAll('.chime-tube');
        
        let startX = 0;

        // 触摸开始
        document.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        // 触摸结束
        document.addEventListener('touchend', (e) => {
            let endX = e.changedTouches[0].clientX;
            
            // 识别左滑 (滑动距离大于50px)
            if (startX - endX > 50) {
                if (homepage.style.display !== 'none') {
                    swipePage();
                } else {
                    playChimeEffect();
                }
            }
        });

        // 切换页面动画
        function swipePage() {
            gsap.to(homepage, {
                x: '-100%',
                duration: 0.8,
                ease: "power2.inOut",
                onComplete: () => {
                    homepage.style.display = 'none';
                    // 进入页面时也可以触发一次轻微动效
                    playChimeEffect(0.5);
                }
            });
        }

        // 风铃碰撞特效
        function playChimeEffect(intensity = 1) {
            // 播放音效
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Audio play blocked"));

            // 每个管子随机摆动（模拟碰撞）
            tubes.forEach((tube, index) => {
                const angle = (Math.random() * 5 + 3) * (index % 2 === 0 ? 1 : -1) * intensity;
                
                gsap.to(tube, {
                    rotation: angle,
                    transformOrigin: "50% 0%", // 从顶部摆动
                    duration: 0.2,
                    yoyo: true,
                    repeat: 5,
                    ease: "sine.inOut",
                    onComplete: () => {
                        gsap.to(tube, { rotation: 0, duration: 1.5, ease: "elastic.out(1, 0.3)" });
                    }
                });
            });
        }
    </script>
</body>
</html>

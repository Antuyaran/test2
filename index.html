<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wind Chime Project</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #55AEFF; 
            overflow: hidden; touch-action: none;
        }

        /* 页面容器管理 */
        .page-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
        }

        #page-intro { z-index: 10; background: #55AEFF; } /* 首页在上 */
        #page-main { z-index: 5; } /* 风铃在下 */

        svg { width: 100vw; height: 100vh; display: block; }
        
        /* 隔离首页样式 [cite: 5-11] */
        #page-intro .st0{fill:none;}
        #page-intro .st1{font-family:'PingFangSC-Semibold';}
        #page-intro .st2{font-size:21px;}
        #page-intro .st3{fill:#EFEFEF;stroke:#999999;stroke-width:2;stroke-miterlimit:10;}
        #page-intro .st4{font-family:'PingFangSC-Semibold'; font-weight: bold;}
        #page-intro .st5{font-size:70px;}

        /* 隔离风铃页样式 [cite: 48-64] */
        #page-main .st0{fill:#55AEFF;}
        #page-main .st1{fill:none;}
        #page-main .st2{fill:#FFFFFF;}
        #page-main .st3{font-family:'PingFangSC-Semibold';}
        #page-main .st4{font-size:21px;}
        #page-main .st5{fill:none;stroke:#5B5B5B;stroke-width:4;stroke-miterlimit:10;}

        /* 风铃交互部分的旋转中心 */
        .chime-piece { transform-origin: 50% 0%; cursor: pointer; }
        #fengling-video { display: none; }
    </style>
</head>
<body>

<video id="fengling-video" playsinline webkit-playsinline>
    <source src="fengling.mp4" type="video/mp4">
</video>

<div id="page-intro" class="page-wrapper">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1150" preserveAspectRatio="xMidYMin slice">
        <g id="图层_5">
            <rect x="57.22" y="1104.22" class="st0" width="149.06" height="27.65"/>
            <text transform="matrix(1 0 0 1 57.2224 1122.283)" class="st1 st2" fill="white">Home Page</text>
            <rect x="442.78" y="1104.22" class="st0" width="151.76" height="27.65"/>
            <text transform="matrix(1 0 0 1 442.7775 1122.2825)" class="st1 st2" fill="white">Project Name</text>
            <rect x="643.46" y="1104.22" class="st0" width="35.31" height="27.65"/>
            <text transform="matrix(1 0 0 1 643.4626 1122.282)" class="st1 st2" fill="white">00</text>
        </g>
        <g id="图层_4">
            <rect x="153.84" y="106.16" class="st3" width="475.6" height="871.22"/>
            <rect x="129.44" y="119.72" class="st3" width="475.6" height="871.22"/>
        </g>
        <g id="图层_3">
            <rect x="129.44" y="119.72" class="st3" width="475.6" height="871.22"/>
        </g>
        <g id="图层_2">
            <rect x="105.04" y="134.02" class="st3" width="475.6" height="871.22"/>
            <text transform="matrix(1 0 0 1 146.0762 258.6869)">
                <tspan x="0" y="0" class="st4 st5">Turn left </tspan>
                <tspan x="0" y="90" class="st4 st5">to the </tspan>
                <tspan x="0" y="180" class="st4 st5">next page</tspan>
            </text>
        </g>
        <g id="图层_1">
            <rect x="616.92" y="560.43" width="79.71" height="22.44" transform="rotate(180 656.77 571.65)"/>
            <rect x="538.76" y="538.96" width="79.71" height="22.44" transform="rotate(180 578.61 550.18)"/>
            <rect x="479.8" y="559.71" width="79.71" height="22.44" transform="rotate(-135 519.65 570.93)"/>
            <rect x="479.8" y="519.47" width="79.71" height="22.44" transform="rotate(135 519.65 530.69)"/>
        </g>
    </svg>
</div>

<div id="page-main" class="page-wrapper">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1150" preserveAspectRatio="xMidYMin slice">
        <g id="fl_bg">
            <rect x="-19" y="-20" class="st0" width="781" height="1174"/>
            <text transform="matrix(1 0 0 1 57.2224 1122.283)" class="st2 st3 st4">Wind chime</text>
            <text transform="matrix(1 0 0 1 442.7775 1122.2825)" class="st2 st3 st4">Project Name</text>
            <text transform="matrix(1 0 0 1 643.4626 1122.282)" class="st2 st3 st4">01</text>
        </g>
        
        <g id="图层_5" class="chime-piece">
            <line class="st5" x1="519" y1="-304" x2="365.6" y2="995.1"/>
            <linearGradient id="FL_SVGID_1" gradientUnits="userSpaceOnUse" x1="409.33" y1="511.32" x2="447.83" y2="511.32" gradientTransform="matrix(0.994 0.1093 0.1093 -0.994 -51.8 1093.6)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#FL_SVGID_1);" points="386.7,1203.3 348.4,1199.2 473.5,61 511.8,65.2"/>
        </g>
        <g id="图层_4" class="chime-piece">
            <line class="st5" x1="291" y1="-467" x2="263.1" y2="1032.4"/>
            <linearGradient id="FL_SVGID_4" gradientUnits="userSpaceOnUse" x1="279" y1="490" x2="317" y2="490" gradientTransform="matrix(1 0 0 -1 0 1152)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <rect x="241" y="90" width="38" height="1144" style="fill:url(#FL_SVGID_4);"/>
            <rect x="279" y="90" width="38" height="1144" style="fill:url(#FL_SVGID_4);"/>
        </g>
        <g id="图层_3" class="chime-piece">
            <line class="st5" x1="254" y1="-353" x2="49" y2="726"/>
            <linearGradient id="FL_SVGID_3" gradientUnits="userSpaceOnUse" x1="75.84" y1="601.12" x2="114.34" y2="601.12" gradientTransform="matrix(0.982 0.187 0.187 -0.982 -102.3 1108.5)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#FL_SVGID_3);" points="33.1,1008.4 -4.7,1001.2 173.9,63 211.7,70.2"/>
        </g>
        <g id="图层_2" class="chime-piece">
            <line class="st5" x1="489" y1="-370" x2="227" y2="956.5"/>
            <linearGradient id="FL_SVGID_2" gradientUnits="userSpaceOnUse" x1="318.64" y1="642.53" x2="357.17" y2="642.53" gradientTransform="matrix(0.984 0.178 0.178 -0.984 -109 1080.7)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <polygon style="fill:url(#FL_SVGID_2);" points="271.8,982 233.9,975.2 404.1,35.4 442,42.3"/>
        </g>
        <g id="图层_1" class="chime-piece">
            <line class="st5" x1="600" y1="-274" x2="595" y2="837.5"/>
            <linearGradient id="FL_SVGID_1_B" gradientUnits="userSpaceOnUse" x1="598.95" y1="701.05" x2="637.45" y2="701.05" gradientTransform="matrix(1 0 0 -1 0 1152)">
                <stop offset="0" style="stop-color:#FFFFFF"/><stop offset="1" style="stop-color:#000000"/>
            </linearGradient>
            <rect x="560.5" y="54.5" width="38.5" height="793" style="fill:url(#FL_SVGID_1_B);"/>
            <rect x="599" y="54.5" width="38.5" height="793" style="fill:url(#FL_SVGID_1_B);"/>
        </g>
    </svg>
</div>

<script>
    const video = document.getElementById('fengling-video');
    const pageIntro = document.getElementById('page-intro');
    const pageMain = document.getElementById('page-main');
    
    const mcIntro = new Hammer(pageIntro);
    const mcMain = new Hammer(pageMain);
    let isAudioUnlocked = false;
    let currentScene = 0;

    function unlockAudio() {
        if (!isAudioUnlocked) {
            video.play().then(() => { video.pause(); isAudioUnlocked = true; });
        }
    }

    // ================= 场景 0：整个首页左滑划掉 =================
    mcIntro.on("swipeleft", (ev) => {
        unlockAudio();
        // 整个首页容器作为一个整体向左飞出
        gsap.to(pageIntro, {
            x: -window.innerWidth, 
            rotation: -5, // 增加微小旋转增强卡片感
            duration: 0.8, 
            ease: "power2.inOut",
            onComplete: () => {
                pageIntro.style.display = "none";
                currentScene = 1;
                // 风铃页入场小震动
                gsap.from(".chime-piece", {
                    rotation: 5,
                    stagger: 0.08,
                    duration: 2,
                    ease: "elastic.out(1, 0.5)"
                });
            }
        });
    });

    // ================= 场景 1：风铃物理交互 (保持之前逻辑) =================
    mcMain.on("panleft panright", (ev) => {
        if (currentScene !== 1) return;
        unlockAudio();
        if (Math.abs(ev.velocity) > 0.1) {
            const power = ev.velocityX * 10; 
            gsap.to(".chime-piece", {
                rotation: power, 
                duration: 0.8,
                stagger: { each: 0.05, from: power > 0 ? "start" : "end" },
                ease: "power1.out",
                onStart: () => {
                    if (isAudioUnlocked) { video.currentTime = 0; video.play(); }
                },
                onComplete: () => {
                    gsap.to(".chime-piece", {
                        rotation: 0,
                        duration: 4,
                        stagger: 0.03,
                        ease: "elastic.out(1, 0.85)" 
                    });
                }
            });
        }
    });

    document.body.addEventListener('touchstart', unlockAudio, { once: true });
</script>
</body>
</html>
